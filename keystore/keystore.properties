# Release signing configuration for Compass.
#
# !! PERSONAL USE ONLY !!
# This keystore and these passwords are committed to the repository on
# purpose so that the release APK can always be rebuilt. Treat the whole
# repository as a secret.
#
# NEVER LOSE THE KEYSTORE.
# If the keystore is lost, the installed app can never be updated again -
# Android refuses to install a different signature over an existing app.
# The only way out is to uninstall the app, which deletes the vault and
# every file in it, forever.
storeFile=keystore/compass-release.jks
storePassword=compass-vault-2024
keyAlias=compass
keyPassword=compass-vault-2024
